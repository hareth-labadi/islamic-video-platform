<!doctype html><html lang="ar"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF8F2}
a{color:#065A4C;text-decoration:none}
button{font:inherit}
.disp{font-family:'Amiri',serif;font-weight:700}
.lat{font-family:'Inter',sans-serif}
.zl{background-image:url(assets/zellige-light.svg);background-size:80px 80px}
.thumb{position:relative;overflow:hidden;aspect-ratio:16/9;border-radius:10px;background-color:#DCE7E0;display:flex;align-items:center;justify-content:center}
.thumb .pt{position:absolute;inset:0;background-image:url(assets/zellige-green.svg);background-size:44px 44px}
.dur{position:absolute;bottom:5px;left:5px;direction:ltr;font-family:'Inter',sans-serif;font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums;color:#FFFFFF;background:rgba(20,28,25,.82);padding:2px 5px;border-radius:5px}
.pill{flex:none;display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 15px;border-radius:999px;border:1px solid #E3DACA;background:#FFFFFF;font-size:13.5px;color:#1D2522;white-space:nowrap}
.tab{flex:1;border:0;background:transparent;padding:13px 0;font-size:14px;color:#5B635F;border-bottom:2px solid transparent}
.tab.on{color:#0B3D34;font-weight:600;border-bottom-color:#AD9559}
.ep{display:flex;gap:10px;align-items:center;padding:8px;border-radius:14px;color:inherit}
.ep-t{margin:0;font-size:13.5px;font-weight:500;line-height:1.5;color:#1D2522;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ts{direction:ltr;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:#065A4C;min-width:42px;text-align:right}
.ltag{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:#E1EEE8;color:#0B3D34}
.ltag.k{background:#F4EBD6;color:#5E4D22;font-family:'Inter',sans-serif}
</style>
<style>*{animation-play-state:paused!important;animation-delay:-10s!important}</style><script>const STATE={};</script>
<script>
class DCLogic { constructor(p){ this.props = p || {}; this.state = {}; } setState(s){ Object.assign(this.state, typeof s === 'function' ? s(this.state) : s); } forceUpdate(){} }
function look(scope, path){ path = path.trim(); if (path === 'true') return true; if (path === 'false') return false; if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  let v = scope; for (const k of path.split('.')) { if (v == null) return undefined; v = v[k]; } return v; }
function interp(str, scope){ const m = str.match(/^\s*\{\{([^}]+)\}\}\s*$/); if (m) return look(scope, m[1]);
  return str.replace(/\{\{([^}]+)\}\}/g, (_, p) => { const v = look(scope, p); return v == null ? '' : String(v); }); }
function render(node, scope, out){
  if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.textContent, scope))); return; }
  if (node.nodeType !== 1) return;
  const tag = node.tagName.toLowerCase();
  if (tag === 'sc-for') { const list = interp(node.getAttribute('list'), scope) || []; const as = node.getAttribute('as');
    list.forEach((item, i) => { const s = Object.assign(Object.create(scope), { [as]: item, $index: i }); node.childNodes.forEach(c => render(c, s, out)); }); return; }
  if (tag === 'sc-if') { if (interp(node.getAttribute('value'), scope)) node.childNodes.forEach(c => render(c, scope, out)); return; }
  const el = document.createElementNS(node.namespaceURI, node.localName);
  for (const a of node.attributes) { if (/^on[A-Z]/.test(a.name) || a.name.startsWith('hint-')) continue; const v = interp(a.value, scope); if (v === false || v == null) continue; el.setAttribute(a.name, typeof v === 'function' ? '' : v); }
  const src = tag === 'template' ? node.content : node;
  src.childNodes.forEach(c => render(c, scope, el));
  out.appendChild(el);
}
window.addEventListener('DOMContentLoaded', () => {
  const C = new Function('DCLogic', document.getElementById('logic').textContent + '; return Component;')(DCLogic);
  const inst = new C({}); Object.assign(inst.state, STATE);
  const vals = inst.renderVals();
  const tpl = document.getElementById('tpl').content;
  const host = document.getElementById('host');
  tpl.childNodes.forEach(c => render(c, vals, host));
});
</script>
</head><body><template id="tpl">

    <div dir="ltr" style="position:absolute;left:0;right:0;bottom:0;padding:22px 12px 8px;background:linear-gradient(to top,rgba(6,24,21,.85),rgba(6,24,21,0));display:flex;flex-direction:column;gap:6px;font-family:'Inter',sans-serif;font-size:12px;color:#FFFFFF">
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-variant-numeric:tabular-nums">05:26 / 17:33</span><span style="display:flex;gap:14px;align-items:center;font-weight:700"><span style="border:1.5px solid #FFFFFF;border-radius:4px;padding:0 4px;font-size:10.5px">CC</span><span>1×</span><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg></span></div>
      <div style="position:relative;height:4px;border-radius:999px;background:rgba(255,255,255,.28)"><div style="position:absolute;left:0;top:0;bottom:0;width:31%;border-radius:999px;background:#C9AE6A"></div><span style="position:absolute;left:31%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:999px;background:#FFFFFF"></span></div>
    </div>
  </div>

  <div style="padding:18px 16px 0;display:flex;flex-direction:column;gap:10px">
    <span style="font-size:12.5px;font-weight:600;color:#7A6532">الحلقة <span class="lat">5</span> من <span class="lat">24</span></span>

    <div style="display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;color:#5B635F"><span>18 أكتوبر 2026</span><span class="ltag">العربية</span><span class="ltag k">CC · Taqbaylit</span></div>
    <div style="display:flex;gap:8px;overflow-x:auto;margin:4px -16px 0;padding:0 16px">
      <button type="button" class="pill">مشاركة</button>
      <button type="button" class="pill">رابط عند <span class="lat">05:26</span></button>
      <button type="button" class="pill" aria-pressed="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><rect x="3" y="15" width="4" height="6" rx="1"></rect><rect x="17" y="15" width="4" height="6" rx="1"></rect></svg>صوت فقط</button>
      <button type="button" class="pill">جودة أخفّ</button>

    <a href="#" style="display:flex;gap:12px;align-items:center;padding:12px;border-radius:18px;background:#0E4A3F;color:#FFFFFF;margin-top:8px">
      <div class="thumb" style="width:112px;flex:none;background-color:#EADFCB"><span class="pt"></span><span class="dur">21:02</span></div>
      <div style="display:flex;flex-direction:column;gap:3px;min-width:0"><span style="font-size:11px;font-weight:600;color:#E4D5AE">التالي · الحلقة <span class="lat">06</span></span><span style="font-size:14px;font-weight:600;line-height:1.5">عنوان الحلقة السادسة</span></div>

  </div>

  <div role="tablist" aria-label="تفاصيل المقطع" style="display:flex;border-bottom:1px solid #E3DACA;margin:18px 16px 0">
    <button type="button" role="tab" class="tab" aria-selected="false">الوصف</button>
    <button type="button" role="tab" class="tab on" aria-selected="true">الحلقات</button>
    <button type="button" role="tab" class="tab" aria-selected="false">النص المكتوب</button>
  </div>
  <div role="tabpanel" style="padding:10px 8px 0">
    <div style="padding:4px 8px 10px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:#5B635F"><span><strong style="color:#1D2522;font-weight:600">دلائل النبوّة</strong> · <span class="lat">24</span> حلقة</span><span class="lat">5 / 24</span></div>
    <ol style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px">
      <sc-for list="{{eps}}" as="e" hint-placeholder-count="6">
        <li><a class="ep" href="#" style="background:{{e.bg}}" aria-current="{{e.cur}}">
          <span style="flex:none;width:26px;text-align:center;font-family:'Amiri',serif;font-size:21px;color:{{e.nc}}">{{e.n}}</span>
          <div class="thumb" style="width:110px;flex:none;background-color:{{e.tone}}"><span class="pt"></span><span class="dur">{{e.dur}}</span></div>
          <div style="display:flex;flex-direction:column;gap:2px;min-width:0"><p class="ep-t">{{e.title}}</p><sc-if value="{{e.isCur}}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;font-weight:600;color:#065A4C">تُعرض الآن</span></sc-if></div>
        </a></li>

  <section aria-labelledby="tr-h" style="margin:22px 16px 0;padding:20px;border-radius:20px;background:#F5EFE3;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;justify-content:space-between;align-items:center"><h2 id="tr-h" class="disp" style="margin:0;font-size:22px;color:#0B3D34">النص المكتوب</h2><span style="font-size:11px;color:#5E4D22;font-weight:600;background:#F4EBD6;padding:3px 9px;border-radius:999px">غير متاح بعد</span></div>
    <p style="margin:0;font-size:14px;line-height:1.75;color:#4A534F">لم يُضَف النص المكتوب لهذه الحلقة بعد. يمكنك تفعيل الترجمة النصية من المشغّل، أو الانتقال عبر الفصول:</p>
    <a href="#" style="display:flex;gap:10px;font-size:14px;color:#1D2522;padding:7px 0;border-bottom:1px solid #E8DFCC"><span class="ts">00:00</span>مقدمة</a>
    <a href="#" style="display:flex;gap:10px;font-size:14px;color:#1D2522;padding:7px 0;border-bottom:1px solid #E8DFCC"><span class="ts">03:10</span>الفصل الأول: عنوان الفصل</a>
    <a href="#" style="display:flex;gap:10px;font-size:14px;color:#0B3D34;font-weight:600;padding:7px 0"><span class="ts">05:02</span>الفصل الثاني: عنوان الفصل</a>
  </section>
</div>
</template><div id="host"></div><script type="text/plain" id="logic">
class Component extends DCLogic {
  renderVals() {
    const tones = ['#DCE7E0', '#EADFCB', '#D9E3E4', '#E9DAD0', '#E3E8D6'];
    const titles = ['مقدّمة: لماذا ندرس دلائل النبوّة؟', 'عنوان الحلقة الثانية', 'عنوان الحلقة الثالثة', 'عنوان الحلقة الرابعة', 'عنوان الحلقة الخامسة يظهر هنا', 'عنوان الحلقة السادسة'];
    const durs = ['14:20', '22:05', '19:48', '25:10', '17:33', '21:02'];
    const eps = titles.map((title, i) => {
      const cur = i === 4;
      return { n: String(i + 1).padStart(2, '0'), title, dur: durs[i], tone: tones[i % tones.length], isCur: cur, cur: cur ? 'true' : 'false', bg: cur ? '#E1EEE8' : 'transparent', nc: cur ? '#0C7765' : '#AD9559' };
    });
    return { eps };
  }
}
</script></body></html>
