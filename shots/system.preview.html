<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Noto+Naskh+Arabic:wght@400..700&amp;family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;family=Noto+Serif+Display:wght@400;500;600&amp;family=Reem+Kufi:wght@400..700&amp;display=swap">
<style>
body{margin:0;background:#FBF8F2}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.fig{background:#E1EEE8;color:#0B3D34}
.new{background:#F4EBD6;color:#5E4D22}
.card{background:#FFFFFF;border:1px solid #E3DACA;border-radius:22px;padding:32px}
.h2{margin:0;font-family:'Noto Serif Display',serif;font-size:36px;font-weight:500;letter-spacing:-.01em;color:#0B3D34}
.h3{margin:0;font-size:16px;font-weight:600;color:#1D2522}
.p{margin:0;font-size:15px;line-height:1.6;color:#5B635F}
.kick{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#7A6532}
.sw{display:flex;flex-direction:column;gap:6px}
.sw .c{height:92px;border-radius:14px;border:1px solid rgba(0,0,0,.06)}
.sw .n{font-size:14px;font-weight:600;color:#1D2522;margin-top:4px}
.sw .h{font-size:12px;color:#5B635F;font-variant-numeric:tabular-nums}
.sw .u{font-size:12px;line-height:1.45;color:#5B635F}
.rule{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;line-height:1.55;color:#1D2522}
.ok{flex:none;width:22px;height:22px;border-radius:7px;background:#E1EEE8;color:#0B3D34;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.no{flex:none;width:22px;height:22px;border-radius:7px;background:#F6E2DA;color:#7A2E14;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.zg{background-image:url(assets/zellige-gold.svg);background-size:96px 96px}
.zl{background-image:url(assets/zellige-light.svg);background-size:96px 96px}
.zgr{background-image:url(assets/zellige-green.svg);background-size:72px 72px}
.opt{display:flex;flex-direction:column;gap:14px;padding:26px;border-radius:18px;border:1px solid #E3DACA;background:#FBF8F2}
.opt.rec{border:2px solid #0C7765;background:#FFFFFF}
.thumb{position:relative;overflow:hidden;aspect-ratio:16/9;border-radius:14px;background-color:#DCE7E0;display:flex;align-items:center;justify-content:center}
.thumb .pt{position:absolute;inset:0;background-image:url(assets/zellige-green.svg);background-size:64px 64px}
.dur{position:absolute;bottom:8px;left:8px;direction:ltr;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:#FFFFFF;background:rgba(20,28,25,.82);padding:3px 7px;border-radius:6px}
code{font-family:'Inter',monospace;font-size:12.5px;background:#F5EFE3;padding:1px 6px;border-radius:5px;color:#0B3D34}
table{border-collapse:collapse;width:100%}
th{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#5B635F;text-align:left;padding:8px 10px;border-bottom:1.5px solid #E3DACA}
td{font-size:13.5px;color:#1D2522;padding:9px 10px;border-bottom:1px solid #EFE8DA}
.yes{color:#0B6B4F;font-weight:600}
.part{color:#8A5A12;font-weight:600}
.nope{color:#9A3A1A;font-weight:600}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes rise{0%,15%{opacity:0;transform:translateY(22px)}45%,100%{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-240px 0}100%{background-position:240px 0}}
.m-spin{animation:spin 40s linear infinite}
.m-float{animation:float 6s ease-in-out infinite}
.m-rise{animation:rise 3.2s cubic-bezier(.2,.7,.2,1) infinite}
.m-lift{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.m-lift:hover{transform:translateY(-6px);box-shadow:0 18px 30px -18px rgba(11,61,52,.45)}
.m-skel{background:linear-gradient(90deg,#EFE8DA 0,#F8F3EA 50%,#EFE8DA 100%);background-size:480px 100%;animation:shimmer 1.6s linear infinite}
@media (prefers-reduced-motion:reduce){.m-spin,.m-float,.m-rise,.m-skel{animation:none}}
</style>
<style>*{animation-play-state:paused!important;animation-delay:-10s!important}</style><script>const STATE={};</script>
<script>
class DCLogic { constructor(p){ this.props = p || {}; this.state = {}; } setState(s){ Object.assign(this.state, typeof s === 'function' ? s(this.state) : s); } forceUpdate(){} }
function look(scope, path){ path = path.trim(); if (path === 'true') return true; if (path === 'false') return false; if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  let v = scope; for (const k of path.split('.')) { if (v == null) return undefined; v = v[k]; } return v; }
function interp(str, scope){ const m = str.match(/^\s*\{\{([^}]+)\}\}\s*$/); if (m) return look(scope, m[1]);
  return str.replace(/\{\{([^}]+)\}\}/g, (_, p) => { const v = look(scope, p); return v == null ? '' : String(v); }); }
function render(node, scope, out){
  if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.textContent, scope))); return; }
  if (node.nodeType !== 1) return;
  const tag = node.tagName.toLowerCase();
  if (tag === 'sc-for') { const list = interp(node.getAttribute('list'), scope) || []; const as = node.getAttribute('as');
    list.forEach((item, i) => { const s = Object.assign(Object.create(scope), { [as]: item, $index: i }); node.childNodes.forEach(c => render(c, s, out)); }); return; }
  if (tag === 'sc-if') { if (interp(node.getAttribute('value'), scope)) node.childNodes.forEach(c => render(c, scope, out)); return; }
  const el = document.createElementNS(node.namespaceURI, node.localName);
  for (const a of node.attributes) { if (/^on[A-Z]/.test(a.name) || a.name.startsWith('hint-')) continue; const v = interp(a.value, scope); if (v === false || v == null) continue; el.setAttribute(a.name, typeof v === 'function' ? '' : v); }
  const src = tag === 'template' ? node.content : node;
  src.childNodes.forEach(c => render(c, scope, el));
  out.appendChild(el);
}
window.addEventListener('DOMContentLoaded', () => {
  const C = new Function('DCLogic', document.getElementById('logic').textContent + '; return Component;')(DCLogic);
  const inst = new C({}); Object.assign(inst.state, STATE);
  const vals = inst.renderVals();
  const tpl = document.getElementById('tpl').content;
  const host = document.getElementById('host');
  tpl.childNodes.forEach(c => render(c, vals, host));
});
</script>
</head><body><template id="tpl">

<div style="width:1440px;min-height:4300px;box-sizing:border-box;padding:80px 80px 96px;font-family:'Inter',system-ui,sans-serif;color:#1D2522;background:#FBF8F2;display:flex;flex-direction:column;gap:40px">

  <header style="position:relative;overflow:hidden;border-radius:28px;background:#F5EFE3;padding:56px 56px 52px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:48px;align-items:center">
    <div class="zg" style="position:absolute;inset:0;opacity:.55;-webkit-mask-image:radial-gradient(circle at 85% 40%,#000 0,transparent 60%);mask-image:radial-gradient(circle at 85% 40%,#000 0,transparent 60%)" aria-hidden="true"></div>
    <div style="position:relative;display:flex;flex-direction:column;gap:18px">
      <span class="kick">Design system · v2 · 30 Oct 2026</span>
      <h1 style="margin:0;font-family:'Noto Serif Display',serif;font-size:60px;line-height:1.04;font-weight:500;letter-spacing:-.02em;color:#0B3D34">Lighter, warmer, and rooted in the Maghreb</h1>
      <p class="p" style="font-size:18px;max-width:620px">Version 1 felt dark and generic. Version 2 keeps the Figma brand — the logo, the green, the gold — but moves the whole site onto warm paper, uses arches and zellige as its signature, replaces the typeface, and adds quiet motion.</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px">
        <span class="tag new">Warm paper ground</span><span class="tag new">New Arabic type</span><span class="tag new">Arch + zellige</span><span class="tag new">Subtle motion</span><span class="tag fig">Logo, green &amp; gold kept</span>
      </div>
    </div>
    <div style="position:relative;display:flex;justify-content:center;align-items:flex-end;height:330px" aria-hidden="true">
      <div style="position:absolute;bottom:0;width:250px;height:320px;border-radius:125px 125px 20px 20px;border:1.5px solid #AD9559;transform:translate(-18px,-14px)"></div>
      <div class="zl" style="position:relative;width:250px;height:320px;border-radius:125px 125px 20px 20px;background-color:#0E4A3F;overflow:hidden;display:flex;align-items:center;justify-content:center">
        <svg class="m-spin" width="230" height="230" viewBox="0 0 100 100" fill="none" stroke="#C9AE6A" stroke-width=".6" stroke-opacity=".7" style="position:absolute;top:30px"><rect x="20" y="20" width="60" height="60"></rect><rect x="20" y="20" width="60" height="60" transform="rotate(45 50 50)"></rect><circle cx="50" cy="50" r="22"></circle></svg>
        <img src="assets/mark-light.png" alt="" style="position:relative;width:110px;height:auto">
      </div>
    </div>
  </header>

  <section style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px">
    <div class="card" style="padding:24px;display:flex;flex-direction:column;gap:8px"><span style="font-family:'Noto Serif Display',serif;font-size:30px;color:#AD9559">01</span><h3 class="h3">Paper, not screen</h3><p class="p" style="font-size:14px">Warm off-white grounds. Deep green only for one signature element per screen.</p></div>
    <div class="card" style="padding:24px;display:flex;flex-direction:column;gap:8px"><span style="font-family:'Noto Serif Display',serif;font-size:30px;color:#AD9559">02</span><h3 class="h3">The arch frames what matters</h3><p class="p" style="font-size:14px">The featured video, the sheikh’s portrait, playlist covers. Never decoration on its own.</p></div>
    <div class="card" style="padding:24px;display:flex;flex-direction:column;gap:8px"><span style="font-family:'Noto Serif Display',serif;font-size:30px;color:#AD9559">03</span><h3 class="h3">Pattern is texture</h3><p class="p" style="font-size:14px">An eight-point zellige lattice, always faint and masked, never behind reading text.</p></div>
    <div class="card" style="padding:24px;display:flex;flex-direction:column;gap:8px"><span style="font-family:'Noto Serif Display',serif;font-size:30px;color:#AD9559">04</span><h3 class="h3">Motion that breathes</h3><p class="p" style="font-size:14px">Slow, small and optional. Nothing loops near reading text; reduced-motion turns it all off.</p></div>
  </section>

  <section class="card" style="display:flex;flex-direction:column;gap:26px">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:24px">
      <div style="display:flex;flex-direction:column;gap:8px"><span class="kick">Typography</span><h2 class="h2">Four pairings — A is recommended</h2></div>
      <p class="p" style="max-width:460px;font-size:14px">Readex Pro is gone. Every option uses IBM Plex Sans Arabic for interface text: calm, very legible on phones, and comfortable in long Arabic titles.</p>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px">
      <div class="opt rec">
        <div style="display:flex;justify-content:space-between;align-items:center"><span class="h3">A · Classical Naskh</span><span class="tag fig">Recommended</span></div>
        <div dir="rtl" lang="ar" style="font-family:'Amiri',serif;font-size:58px;line-height:1.35;font-weight:700;color:#0B3D34">دلائل النبوّة</div>
        <div dir="rtl" lang="ar" style="font-family:'IBM Plex Sans Arabic',sans-serif;font-size:15px;line-height:1.85;color:#5B635F">مقاطع مرئية يشرح فيها الشيخ دلائل النبوّة، بخطٍّ مريح للقراءة.</div>
        <p class="p" style="font-size:13px"><strong style="color:#1D2522">Amiri</strong> headlines + <strong style="color:#1D2522">IBM Plex Sans Arabic</strong> text. The calligraphic contrast of a printed book against a crisp modern sans — an editorial pairing.</p>
      </div>
      <div class="opt">
        <span class="h3">B · Modern Naskh</span>
        <div dir="rtl" lang="ar" style="font-family:'Noto Naskh Arabic',serif;font-size:52px;line-height:1.4;font-weight:600;color:#0B3D34">دلائل النبوّة</div>
        <div dir="rtl" lang="ar" style="font-family:'IBM Plex Sans Arabic',sans-serif;font-size:15px;line-height:1.85;color:#5B635F">مقاطع مرئية يشرح فيها الشيخ دلائل النبوّة، بخطٍّ مريح للقراءة.</div>
        <p class="p" style="font-size:13px"><strong style="color:#1D2522">Noto Naskh Arabic</strong> + Plex. Calmer and more contemporary than Amiri; same family as the Latin headline face.</p>
      </div>
      <div class="opt">
        <span class="h3">C · Geometric Kufi</span>
        <div dir="rtl" lang="ar" style="font-family:'Reem Kufi',sans-serif;font-size:52px;line-height:1.3;font-weight:500;color:#0B3D34">دلائل النبوّة</div>
        <div dir="rtl" lang="ar" style="font-family:'IBM Plex Sans Arabic',sans-serif;font-size:15px;line-height:1.85;color:#5B635F">مقاطع مرئية يشرح فيها الشيخ دلائل النبوّة، بخطٍّ مريح للقراءة.</div>
        <p class="p" style="font-size:13px"><strong style="color:#1D2522">Reem Kufi</strong> + Plex. Architectural, closest to the logo’s angles; less suited to long titles.</p>
      </div>
      <div class="opt">
        <span class="h3">D · One family</span>
        <div dir="rtl" lang="ar" style="font-family:'IBM Plex Sans Arabic',sans-serif;font-size:48px;line-height:1.3;font-weight:600;color:#0B3D34">دلائل النبوّة</div>
        <div dir="rtl" lang="ar" style="font-family:'IBM Plex Sans Arabic',sans-serif;font-size:15px;line-height:1.85;color:#5B635F">مقاطع مرئية يشرح فيها الشيخ دلائل النبوّة، بخطٍّ مريح للقراءة.</div>
        <p class="p" style="font-size:13px">Plex only. Cleanest and fastest to load; least character.</p>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start;padding-top:8px;border-top:1px solid #EFE8DA">
      <div style="display:flex;flex-direction:column;gap:16px;padding-top:18px">
        <span class="h3">Scale (option A)</span>
        <div dir="rtl" style="display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;align-items:baseline;gap:16px"><span dir="ltr" style="width:170px;flex:none;font-size:12px;color:#7A6532">Hero · Amiri 104/1.25</span><span style="font-family:'Amiri',serif;font-size:80px;line-height:1.3;font-weight:700;color:#0B3D34">دلائل النبوّة</span></div>
          <div style="display:flex;align-items:baseline;gap:16px"><span dir="ltr" style="width:170px;flex:none;font-size:12px;color:#7A6532">Section · Amiri 50/1.35</span><span style="font-family:'Amiri',serif;font-size:46px;line-height:1.35;font-weight:700;color:#0B3D34">أحدث المقاطع</span></div>
          <div style="display:flex;align-items:baseline;gap:16px"><span dir="ltr" style="width:170px;flex:none;font-size:12px;color:#7A6532">Subtitle · Amiri 34 regular</span><span style="font-family:'Amiri',serif;font-size:32px;line-height:1.5;font-weight:400;color:#7A6532">شرحٌ مرئيّ، ومقاطع متنوعة</span></div>
          <div style="display:flex;align-items:baseline;gap:16px"><span dir="ltr" style="width:170px;flex:none;font-size:12px;color:#7A6532">Video title · Plex 17/1.6</span><span style="font-family:'IBM Plex Sans Arabic',sans-serif;font-size:17px;line-height:1.6;font-weight:600">عنوان المقطع يظهر هنا في سطرين كحدٍّ أقصى</span></div>
          <div style="display:flex;align-items:baseline;gap:16px"><span dir="ltr" style="width:170px;flex:none;font-size:12px;color:#7A6532">Body · Plex 16/1.85</span><span style="font-family:'IBM Plex Sans Arabic',sans-serif;font-size:16px;line-height:1.85;color:#5B635F">وصف موجز للمقطع بخطٍّ مريح للقراءة الطويلة.</span></div>
          <div style="display:flex;align-items:baseline;gap:16px"><span dir="ltr" style="width:170px;flex:none;font-size:12px;color:#7A6532">Meta · Plex 13 + Inter digits</span><span style="font-family:'IBM Plex Sans Arabic',sans-serif;font-size:13px;color:#5B635F">دلائل النبوّة · الحلقة <span style="font-family:'Inter',sans-serif">12</span> · منذ يومين</span></div>
        </div>
        <div lang="kab" style="display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid #EFE8DA">
          <div style="display:flex;align-items:baseline;gap:16px"><span style="width:170px;flex:none;font-size:12px;color:#7A6532">Taqbaylit hero · Noto Serif Display</span><span style="font-family:'Noto Serif Display',serif;font-size:44px;font-weight:500;color:#0B3D34">Tividyutin timaynutin</span></div>
          <div style="display:flex;align-items:baseline;gap:16px"><span style="width:170px;flex:none;font-size:12px;color:#7A6532">Taqbaylit text · Inter</span><span style="font-family:'Inter',sans-serif;font-size:17px">ɛ ɣ ḍ ḥ ṛ ṣ ṭ ẓ č ǧ — Ɛ Ɣ Ḍ Ḥ Ṛ Ṣ Ṭ Ẓ Č Ǧ</span></div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;padding-top:18px">
        <span class="h3">Tested: which fonts can actually write Taqbaylit?</span>
        <p class="p" style="font-size:13.5px">I downloaded 70+ Google Fonts and checked each for the 20 Kabyle letters (ɛ ɣ ḍ ḥ ṛ ṣ ṭ ẓ č ǧ + capitals). Most fonts — including every Arabic family — miss ɛ and ɣ, so Latin text must switch font by <code>lang</code>.</p>
        <table>
          <thead><tr><th>Font</th><th>Role</th><th>Kabyle letters</th></tr></thead>
          <tbody>
            <tr><td>Inter</td><td>Latin text</td><td class="yes">20 / 20</td></tr>
            <tr><td>Noto Serif Display</td><td>Latin headlines</td><td class="yes">20 / 20</td></tr>
            <tr><td>Noto Sans · Source Sans 3 · Fira Sans</td><td>Alternatives</td><td class="yes">20 / 20</td></tr>
            <tr><td>EB Garamond · Charis SIL · Gentium</td><td>Alternatives</td><td class="yes">20 / 20</td></tr>
            <tr><td>Amiri</td><td>Arabic headlines</td><td class="part">14 / 20 — no ɛ ɣ ṛ</td></tr>
            <tr><td>Markazi Text · Readex Pro · Alexandria</td><td>Arabic families</td><td class="part">16 / 20 — no ɛ ɣ</td></tr>
            <tr><td>IBM Plex Sans Arabic · Tajawal · Cairo</td><td>Arabic families</td><td class="nope">0–2 / 20</td></tr>
            <tr><td>Playfair · DM Sans · Manrope · Open Sans</td><td>Popular Latin</td><td class="nope">2–4 / 20</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="card" style="display:flex;flex-direction:column;gap:24px">
    <div style="display:flex;justify-content:space-between;align-items:flex-end"><div style="display:flex;flex-direction:column;gap:8px"><span class="kick">Colour</span><h2 class="h2">Warm paper, green accent, gold detail</h2></div><div style="display:flex;gap:8px"><span class="tag fig">From Figma</span><span class="tag new">New</span></div></div>
    <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:16px">
      <div class="sw"><div class="c" style="background:#FBF8F2"></div><span class="tag new" style="align-self:flex-start">New</span><span class="n">Paper</span><span class="h">#FBF8F2</span><span class="u">Page ground</span></div>
      <div class="sw"><div class="c" style="background:#F5EFE3"></div><span class="tag new" style="align-self:flex-start">New</span><span class="n">Sand 100</span><span class="h">#F5EFE3</span><span class="u">Hero, alternating bands</span></div>
      <div class="sw"><div class="c" style="background:#ECE3D1"></div><span class="tag new" style="align-self:flex-start">New</span><span class="n">Sand 200</span><span class="h">#ECE3D1</span><span class="u">Footer, strong dividers</span></div>
      <div class="sw"><div class="c" style="background:#FFFFFF"></div><span class="tag new" style="align-self:flex-start">New</span><span class="n">Surface</span><span class="h">#FFFFFF</span><span class="u">Cards, search, player frame</span></div>
      <div class="sw"><div class="c" style="background:#E3DACA"></div><span class="tag new" style="align-self:flex-start">New</span><span class="n">Line</span><span class="h">#E3DACA</span><span class="u">Borders, hairlines</span></div>
      <div class="sw"><div class="c" style="background:#1D2522"></div><span class="tag new" style="align-self:flex-start">New</span><span class="n">Ink</span><span class="h">#1D2522</span><span class="u">Text · 14.8:1 on paper</span></div>
      <div class="sw"><div class="c" style="background:#5B635F"></div><span class="tag new" style="align-self:flex-start">New</span><span class="n">Ink 2</span><span class="h">#5B635F</span><span class="u">Meta · 5.8:1 on paper</span></div>
      <div class="sw"><div class="c" style="background:#0B3D34"></div><span class="tag new" style="align-self:flex-start">New</span><span class="n">Green 900</span><span class="h">#0B3D34</span><span class="u">Headlines · 11.4:1</span></div>
