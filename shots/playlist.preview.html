<!doctype html><html lang="ar"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF8F2}
a{color:#065A4C;text-decoration:none}
a:hover{color:#0B3D34}
button{font:inherit}

.wrap{max-width:1240px;margin:0 auto;padding:0 32px;box-sizing:border-box}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.disp{font-family:'Amiri',serif;font-weight:700}

.kick{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:#7A6532}

.zg{background-image:url(assets/zellige-gold.svg);background-size:96px 96px}
.zl{background-image:url(assets/zellige-light.svg);background-size:96px 96px}
.thumb{position:relative;overflow:hidden;aspect-ratio:16/9;border-radius:12px;background-color:#DCE7E0;display:flex;align-items:center;justify-content:center;transition:transform .4s cubic-bezier(.2,.7,.2,1)}

.dur{position:absolute;bottom:6px;left:6px;direction:ltr;font-family:'Inter',sans-serif;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;color:#FFFFFF;background:rgba(20,28,25,.82);padding:2px 6px;border-radius:5px}
.navlink{font-size:15px;color:#3E4743;padding:8px 2px;border-bottom:2px solid transparent;white-space:nowrap}
.navlink.on{color:#0B3D34;font-weight:600;border-bottom-color:#AD9559}
.btn{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 24px;border-radius:999px;font-size:15.5px;font-weight:600;box-sizing:border-box;transition:transform .25s,box-shadow .25s,background .25s}
.btn-p{background:#065A4C;color:#FFFFFF}
.btn-p:hover{background:#0B3D34;color:#FFFFFF;transform:translateY(-2px);box-shadow:0 14px 24px -14px rgba(6,90,76,.7)}
.btn-g{background:#FFFFFF;color:#0B3D34;border:1.5px solid #D9CCAE}
.btn-g:hover{border-color:#AD9559;transform:translateY(-2px)}
.row{display:flex;gap:20px;align-items:center;padding:14px;border-radius:18px;color:inherit;transition:background .25s}
.row:hover{background:#FFFFFF}
.row:hover .thumb{transform:scale(1.03)}
.n{flex:none;width:58px;text-align:center;font-family:'Amiri',serif;font-size:40px;line-height:1;color:#AD9559}
.rt{margin:0;font-size:17px;font-weight:600;line-height:1.6;color:#1D2522}
.rd{margin:0;font-size:14px;line-height:1.7;color:#5B635F;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.ltag{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:#E1EEE8;color:#0B3D34}
.ltag.k{background:#F4EBD6;color:#5E4D22;font-family:'Inter',sans-serif}
.axh{display:flex;align-items:baseline;gap:14px;padding:0 14px 10px;margin-top:36px;border-bottom:1px solid #E3DACA}
.side{background:#FFFFFF;border:1px solid #E3DACA;border-radius:22px;padding:24px}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.18s}.d3{animation-delay:.28s}.d4{animation-delay:.38s}
.spin{animation:spin 90s linear infinite}
@media (prefers-reduced-motion:reduce){.rise,.spin{animation:none}}
</style>
<style>*{animation-play-state:paused!important;animation-delay:-10s!important}</style><script>const STATE={};</script>
<script>
class DCLogic { constructor(p){ this.props = p || {}; this.state = {}; } setState(s){ Object.assign(this.state, typeof s === 'function' ? s(this.state) : s); } forceUpdate(){} }
function look(scope, path){ path = path.trim(); if (path === 'true') return true; if (path === 'false') return false; if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  let v = scope; for (const k of path.split('.')) { if (v == null) return undefined; v = v[k]; } return v; }
function interp(str, scope){ const m = str.match(/^\s*\{\{([^}]+)\}\}\s*$/); if (m) return look(scope, m[1]);
  return str.replace(/\{\{([^}]+)\}\}/g, (_, p) => { const v = look(scope, p); return v == null ? '' : String(v); }); }
function render(node, scope, out){
  if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.textContent, scope))); return; }
  if (node.nodeType !== 1) return;
  const tag = node.tagName.toLowerCase();
  if (tag === 'sc-for') { const list = interp(node.getAttribute('list'), scope) || []; const as = node.getAttribute('as');
    list.forEach((item, i) => { const s = Object.assign(Object.create(scope), { [as]: item, $index: i }); node.childNodes.forEach(c => render(c, s, out)); }); return; }
  if (tag === 'sc-if') { if (interp(node.getAttribute('value'), scope)) node.childNodes.forEach(c => render(c, scope, out)); return; }
  const el = document.createElementNS(node.namespaceURI, node.localName);
  for (const a of node.attributes) { if (/^on[A-Z]/.test(a.name) || a.name.startsWith('hint-')) continue; const v = interp(a.value, scope); if (v === false || v == null) continue; el.setAttribute(a.name, typeof v === 'function' ? '' : v); }
  const src = tag === 'template' ? node.content : node;
  src.childNodes.forEach(c => render(c, scope, el));
  out.appendChild(el);
}
window.addEventListener('DOMContentLoaded', () => {
  const C = new Function('DCLogic', document.getElementById('logic').textContent + '; return Component;')(DCLogic);
  const inst = new C({}); Object.assign(inst.state, STATE);
  const vals = inst.renderVals();
  const tpl = document.getElementById('tpl').content;
  const host = document.getElementById('host');
  tpl.childNodes.forEach(c => render(c, vals, host));
});
</script>

</template><div id="host"></div><script type="text/plain" id="logic">
class Component extends DCLogic {
  renderVals() {
    const tones = ['#DCE7E0', '#EADFCB', '#D9E3E4', '#E9DAD0', '#E3E8D6'];
    const titles = ['مقدّمة: لماذا ندرس دلائل النبوّة؟', 'عنوان الحلقة الثانية يظهر هنا', 'عنوان أطول للحلقة الثالثة يلتفّ على سطرين كحدٍّ أقصى في القائمة', 'عنوان الحلقة الرابعة', 'عنوان الحلقة الخامسة يظهر هنا', 'عنوان الحلقة السادسة', 'عنوان الحلقة السابعة', 'عنوان الحلقة الثامنة', 'عنوان الحلقة التاسعة'];
    const durs = ['14:20', '22:05', '19:48', '25:10', '17:33', '21:02', '23:40', '18:15', '20:44'];
    const ep = (i) => ({
      n: String(i + 1).padStart(2, '0'),
      title: titles[i],
      desc: 'سطر واحد من وصف الحلقة يساعد على معرفة موضوعها قبل مشاهدتها.',
      dur: durs[i],
      tone: tones[i % tones.length],
      kab: i % 3 === 0,
      seen: i < 4,
      next: i === 4,
      bg: i === 4 ? '#E1EEE8' : 'transparent',
      nc: i === 4 ? '#0C7765' : '#AD9559'
    });
    const axes = [
      { label: 'المحور الأول', name: '[عنوان المحور]', count: '3 حلقات', eps: [0, 1, 2].map(ep) },
      { label: 'المحور الثاني', name: '[عنوان المحور]', count: '3 حلقات', eps: [3, 4, 5].map(ep) },
      { label: 'المحور الثالث', name: '[عنوان المحور]', count: '3 من 18 حلقة', eps: [6, 7, 8].map(ep) }
    ];
    return { axes };
  }
}
</script></body></html>
