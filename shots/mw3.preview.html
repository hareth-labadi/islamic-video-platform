<!doctype html><html lang="ar"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Noto+Naskh+Arabic:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F5F3EE}
a{color:inherit;text-decoration:none}
button{font:inherit}
.ui{font-family:'Thmanyah Sans','IBM Plex Sans Arabic',system-ui,sans-serif}
.disp{font-family:'Thmanyah Serif Display','Noto Naskh Arabic',serif;font-weight:700}
.lat{font-family:'Inter',sans-serif}
.thumb{position:relative;overflow:hidden;aspect-ratio:16/9;border-radius:9px;background:#DAD5CA;flex:none}
.dur{position:absolute;bottom:5px;left:5px;direction:ltr;font-family:'Inter',sans-serif;font-size:10.5px;font-weight:600;color:#FFFFFF;background:rgba(17,22,20,.82);padding:1px 5px;border-radius:5px}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(17,22,20,.15)}
.prog span{position:absolute;top:0;bottom:0;right:0;background:#C9A24A}
.act{flex:none;display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 14px;border-radius:12px;background:#E6E1D6;border:0;font-size:13.5px;color:#111614}
.ep{display:flex;gap:10px;align-items:center;padding:8px 16px}
.et{margin:0;font-size:13.5px;font-weight:600;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kab{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:#F1E7CF;color:#5E4D22;font-family:'Inter',sans-serif}
</style>
<style>*{animation-play-state:paused!important;animation-delay:-10s!important}</style><script>const STATE={};</script>
<script>
class DCLogic { constructor(p){ this.props = p || {}; this.state = {}; } setState(s){ Object.assign(this.state, typeof s === 'function' ? s(this.state) : s); } forceUpdate(){} }
function look(scope, path){ path = path.trim(); if (path === 'true') return true; if (path === 'false') return false; if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  let v = scope; for (const k of path.split('.')) { if (v == null) return undefined; v = v[k]; } return v; }
function interp(str, scope){ const m = str.match(/^\s*\{\{([^}]+)\}\}\s*$/); if (m) return look(scope, m[1]);
  return str.replace(/\{\{([^}]+)\}\}/g, (_, p) => { const v = look(scope, p); return v == null ? '' : String(v); }); }
function render(node, scope, out){
  if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.textContent, scope))); return; }
  if (node.nodeType !== 1) return;
  const tag = node.tagName.toLowerCase();
  if (tag === 'sc-for') { const list = interp(node.getAttribute('list'), scope) || []; const as = node.getAttribute('as');
    list.forEach((item, i) => { const s = Object.assign(Object.create(scope), { [as]: item, $index: i }); node.childNodes.forEach(c => render(c, s, out)); }); return; }
  if (tag === 'sc-if') { if (interp(node.getAttribute('value'), scope)) node.childNodes.forEach(c => render(c, scope, out)); return; }
  const el = document.createElementNS(node.namespaceURI, node.localName);
  for (const a of node.attributes) { if (/^on[A-Z]/.test(a.name) || a.name.startsWith('hint-')) continue; const v = interp(a.value, scope); if (v === false || v == null) continue; el.setAttribute(a.name, typeof v === 'function' ? '' : v); }
  const src = tag === 'template' ? node.content : node;
  src.childNodes.forEach(c => render(c, scope, el));
  out.appendChild(el);
}
window.addEventListener('DOMContentLoaded', () => {
  const C = new Function('DCLogic', document.getElementById('logic').textContent + '; return Component;')(DCLogic);
  const inst = new C({}); Object.assign(inst.state, STATE);
  const vals = inst.renderVals();
  const tpl = document.getElementById('tpl').content;
  const host = document.getElementById('host');
  tpl.childNodes.forEach(c => render(c, vals, host));
});
</script>
</head><body><template id="tpl">

<div class="ui" style="position:relative;width:390px;height:1460px;overflow:hidden;background:#F5F3EE;color:#111614" dir="rtl" lang="ar">

  <div role="region" aria-label="مشغّل الفيديو" style="position:relative;aspect-ratio:16/9;background:#1B211F;display:flex;align-items:center;justify-content:center">
    <a href="MobileHome.dc.html" aria-label="تصغير المشغّل" style="position:absolute;top:6px;right:6px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#FFFFFF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></a>
    <button type="button" aria-label="إيقاف مؤقت" style="width:58px;height:58px;border-radius:999px;border:0;background:rgba(245,243,238,.95);color:#111614;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></button>
    <div dir="ltr" style="position:absolute;left:0;right:0;bottom:0;padding:20px 12px 8px;background:linear-gradient(to top,rgba(0,0,0,.8),rgba(0,0,0,0));display:flex;flex-direction:column;gap:6px;font-family:'Inter',sans-serif;font-size:11.5px;color:#FFFFFF">
      <div style="display:flex;justify-content:space-between"><span>05:26 / 17:33</span><span style="display:flex;gap:14px;font-weight:700"><span style="border:1.5px solid #FFFFFF;border-radius:4px;padding:0 4px;font-size:10px">CC</span><span>1×</span></span></div>
      <div style="position:relative;height:4px;border-radius:999px;background:rgba(255,255,255,.28)"><div style="position:absolute;left:0;top:0;bottom:0;width:31%;border-radius:999px;background:#C9A24A"></div><span style="position:absolute;left:31%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:999px;background:#FFFFFF"></span></div>
    </div>
  </div>

  <div style="padding:14px 16px 0;display:flex;flex-direction:column;gap:8px">
    <a href="Playlist.dc.html" style="font-size:12.5px;font-weight:600;color:#065A4C">دلائل النبوّة · الحلقة <span class="lat">5</span> من <span class="lat">24</span> ‹</a>
    <h1 class="disp" style="margin:0;font-size:24px;line-height:1.45">عنوان الحلقة الخامسة يظهر هنا</h1>
    <div style="display:flex;gap:6px;align-items:center;font-size:12px;color:#6B706C"><span><span class="lat">16</span> سبتمبر</span><span>·</span><span>بالعربية</span><span class="kab">CC · Taqbaylit</span></div>
    <div style="display:flex;gap:8px;overflow-x:auto;margin:4px -16px 0;padding:0 16px">
      <button type="button" class="act">مشاركة</button>
      <button type="button" class="act" aria-pressed="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><rect x="3" y="15" width="4" height="6" rx="1"></rect><rect x="17" y="15" width="4" height="6" rx="1"></rect></svg>صوت فقط</button>
      <button type="button" class="act">الفصول</button>
      <button type="button" class="act">الوصف</button>
    </div>
  </div>

  <div style="margin:16px 16px 0;padding:12px 14px;border-radius:14px;background:#FFFFFF;display:flex;flex-direction:column;gap:4px">
    <span style="font-size:12px;font-weight:600;color:#6B706C">الفصل الحالي</span>
    <span style="font-size:14.5px;font-weight:600"><span class="lat" style="color:#065A4C">05:02</span> · الفصل الثاني: عنوان الفصل</span>
  </div>

  <div style="margin-top:18px;border-top:1px solid #E4E0D6">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px"><span style="font-size:16px;font-weight:700">التالي في السلسلة</span><span style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:#6B706C">تلقائي<span role="switch" aria-checked="false" aria-label="تشغيل التالي تلقائيًا" style="width:34px;height:20px;border-radius:999px;background:#D6D0C3;position:relative;display:inline-block"><span style="position:absolute;top:3px;right:3px;width:14px;height:14px;border-radius:999px;background:#FFFFFF"></span></span></span></div>
    <sc-for list="{{eps}}" as="e" hint-placeholder-count="6">
      <a class="ep" href="#" style="background:{{e.bg}}">
        <span class="disp" style="width:24px;text-align:center;font-size:17px;color:{{e.nc}}">{{e.n}}</span>
        <div class="thumb" style="width:112px;background:{{e.tone}}"><span class="dur">{{e.dur}}</span><sc-if value="{{e.p}}" hint-placeholder-val="{{ false }}"><span class="prog"><span style="width:{{e.p}}"></span></span></sc-if></div>
        <div style="display:flex;flex-direction:column;gap:2px;min-width:0"><p class="et">{{e.title}}</p><span style="font-size:11.5px;font-weight:600;color:{{e.sc}}">{{e.state}}</span></div>
      </a>
    </sc-for>
  </div>
</div>
</template><div id="host"></div><script type="text/plain" id="logic">
class Component extends DCLogic {
  renderVals() {
    const tones = ['#DAD5CA', '#CFD8D2', '#D8D2C4', '#D3D9DB', '#E0D6CB'];
    const titles = ['عنوان الحلقة الخامسة يظهر هنا', 'عنوان الحلقة السادسة', 'عنوان الحلقة السابعة', 'عنوان الحلقة الثامنة', 'عنوان الحلقة التاسعة', 'عنوان الحلقة العاشرة'];
    const durs = ['17:33', '21:02', '23:40', '18:15', '20:44', '19:30'];
    const eps = titles.map((title, i) => {
      const cur = i === 0;
      return { n: String(i + 5).padStart(2, '0'), title, dur: durs[i], tone: tones[i % tones.length], bg: cur ? '#EEF4F1' : 'transparent', nc: cur ? '#065A4C' : '#B79A57', p: cur ? '31%' : '', state: cur ? 'تُعرض الآن' : (i === 1 ? 'التالية' : ''), sc: cur ? '#065A4C' : '#6B706C' };
    });
    return { eps };
  }
}
</script></body></html>
