<!doctype html><html lang="ar"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Noto+Naskh+Arabic:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F5F3EE}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #AD9559;outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px;box-sizing:border-box}
.ui{font-family:'Thmanyah Sans','IBM Plex Sans Arabic',system-ui,sans-serif}
.disp{font-family:'Thmanyah Serif Display','Noto Naskh Arabic',serif;font-weight:700}
.lat{font-family:'Inter',sans-serif}
.nav a{padding:8px 14px;border-radius:999px;font-size:15px;color:#3A403D;white-space:nowrap}
.nav a.on{background:#E6E1D6;color:#111614;font-weight:600}
.thumb{position:relative;overflow:hidden;aspect-ratio:16/9;border-radius:12px;background-color:#DAD5CA}
.dur{position:absolute;bottom:7px;left:7px;direction:ltr;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:#FFFFFF;background:rgba(17,22,20,.82);padding:2px 7px;border-radius:6px}
.prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(17,22,20,.15)}
.prog span{position:absolute;top:0;bottom:0;right:0;background:#C9A24A}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:48px;padding:0 22px;border-radius:12px;font-size:15.5px;font-weight:600;box-sizing:border-box;border:0}
.btn-p{background:#065A4C;color:#FFFFFF}
.btn-s{background:#E6E1D6;color:#111614}
.chip{height:38px;padding:0 16px;border-radius:999px;border:1px solid #E4E0D6;background:#FFFFFF;font-size:14px;color:#3A403D}
.chip.on{background:#111614;border-color:#111614;color:#FFFFFF;font-weight:600}
.row{display:grid;grid-template-columns:44px 220px minmax(0,1fr) 140px;gap:22px;align-items:center;padding:16px 12px;border-radius:14px;color:inherit;transition:background .2s}
.row:hover{background:#FFFFFF}
.n{font-family:'Thmanyah Serif Display','Noto Naskh Arabic',serif;font-size:28px;font-weight:700;color:#B79A57;text-align:center}
.rt{margin:0;font-size:17.5px;font-weight:700;line-height:1.55;color:#111614}
.rd{margin:0;font-size:14.5px;line-height:1.7;color:#5B635F;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.m{font-size:13px;color:#6B706C;display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center}
.kab{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:#F1E7CF;color:#5E4D22;font-family:'Inter',sans-serif}
.axh{display:flex;align-items:baseline;gap:12px;padding:30px 12px 12px;border-bottom:1px solid #E4E0D6;margin-bottom:6px}
.zl{background-image:url(assets/zellige-light.svg);background-size:72px 72px}
</style>
<style>*{animation-play-state:paused!important;animation-delay:-10s!important}</style><script>const STATE={};</script>
<script>
class DCLogic { constructor(p){ this.props = p || {}; this.state = {}; } setState(s){ Object.assign(this.state, typeof s === 'function' ? s(this.state) : s); } forceUpdate(){} }
function look(scope, path){ path = path.trim(); if (path === 'true') return true; if (path === 'false') return false; if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  let v = scope; for (const k of path.split('.')) { if (v == null) return undefined; v = v[k]; } return v; }
function interp(str, scope){ const m = str.match(/^\s*\{\{([^}]+)\}\}\s*$/); if (m) return look(scope, m[1]);
  return str.replace(/\{\{([^}]+)\}\}/g, (_, p) => { const v = look(scope, p); return v == null ? '' : String(v); }); }
function render(node, scope, out){
  if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.textContent, scope))); return; }
  if (node.nodeType !== 1) return;
  const tag = node.tagName.toLowerCase();
  if (tag === 'sc-for') { const list = interp(node.getAttribute('list'), scope) || []; const as = node.getAttribute('as');
    list.forEach((item, i) => { const s = Object.assign(Object.create(scope), { [as]: item, $index: i }); node.childNodes.forEach(c => render(c, s, out)); }); return; }
  if (tag === 'sc-if') { if (interp(node.getAttribute('value'), scope)) node.childNodes.forEach(c => render(c, scope, out)); return; }
  const el = document.createElementNS(node.namespaceURI, node.localName);
  for (const a of node.attributes) { if (/^on[A-Z]/.test(a.name) || a.name.startsWith('hint-')) continue; const v = interp(a.value, scope); if (v === false || v == null) continue; el.setAttribute(a.name, typeof v === 'function' ? '' : v); }
  const src = tag === 'template' ? node.content : node;
  src.childNodes.forEach(c => render(c, scope, el));
  out.appendChild(el);
}
window.addEventListener('DOMContentLoaded', () => {
  const C = new Function('DCLogic', document.getElementById('logic').textContent + '; return Component;')(DCLogic);
  const inst = new C({}); Object.assign(inst.state, STATE);
  const vals = inst.renderVals();
  const tpl = document.getElementById('tpl').content;
  const host = document.getElementById('host');
  tpl.childNodes.forEach(c => render(c, vals, host));
});
</script>
</head><body><template id="tpl">

<div class="ui" style="width:100%;min-height:100vh;background:#F5F3EE;color:#111614" dir="rtl" lang="ar">

  <header style="position:sticky;top:0;z-index:5;background:rgba(245,243,238,.94);border-bottom:1px solid #E4E0D6">
    <div class="wrap" style="display:flex;align-items:center;gap:12px 20px;min-height:72px;flex-wrap:wrap">
      <a href="Home.dc.html" style="display:flex;align-items:center;gap:10px;flex:none" aria-label="علم نافع — الرئيسية"><img src="assets/mark.png" alt="" style="height:36px;width:auto"><span class="disp" style="font-size:24px;line-height:1">علم نافع</span></a>
      <nav class="nav" aria-label="القائمة الرئيسية" style="display:flex;gap:2px;overflow-x:auto;margin-inline-start:10px">
        <a href="Home.dc.html">الرئيسية</a><a class="on" href="#" aria-current="page">دلائل النبوّة</a><a href="Search.dc.html">كل المقاطع</a><a href="#">قوائم التشغيل</a><a href="#">عن الشيخ</a>
      </nav>
      <div style="display:flex;align-items:center;gap:10px;margin-inline-start:auto">
        <a href="SearchPalette.dc.html" style="display:flex;align-items:center;gap:10px;width:250px;height:42px;padding:0 14px;border-radius:12px;background:#FFFFFF;border:1px solid #E4E0D6;color:#6B706C;font-size:14px;box-sizing:border-box"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><span style="flex:1">ابحث في المقاطع</span><kbd class="lat" style="font-size:11px;padding:2px 7px;border-radius:6px;border:1px solid #E4E0D6">/</kbd></a>
        <a href="HomeKabyle.dc.html" lang="kab" class="lat" style="height:42px;display:flex;align-items:center;padding:0 12px;font-size:14px;font-weight:500">Taqbaylit</a>
      </div>
    </div>
  </header>

  <main class="wrap" style="padding-top:36px;padding-bottom:80px">
    <section style="display:grid;grid-template-columns:280px minmax(0,1fr);gap:40px;align-items:center">
      <div class="zl" style="position:relative;aspect-ratio:1;border-radius:18px;background-color:#0E4A3F;color:#FFFFFF;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;box-sizing:border-box;overflow:hidden">
        <svg aria-hidden="true" width="70" height="70" viewBox="0 0 100 100" fill="none" stroke="#C9A24A" stroke-width="3" style="position:absolute;top:22px;right:22px"><rect x="22" y="22" width="56" height="56"></rect><rect x="22" y="22" width="56" height="56" transform="rotate(45 50 50)"></rect></svg>
        <span style="font-size:13px;color:#CFE3DD">سلسلة · <span class="lat">24</span> حلقة</span>
        <span class="disp" style="font-size:44px;line-height:1.3">دلائل النبوّة</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <nav aria-label="مسار التنقل" style="font-size:13px;color:#6B706C"><a href="Home.dc.html">الرئيسية</a> ‹ <a href="#">قوائم التشغيل</a></nav>
        <h1 class="disp" style="margin:0;font-size:48px;line-height:1.3">دلائل النبوّة</h1>
        <p style="margin:0;font-size:16.5px;line-height:1.85;color:#4A504D;max-width:680px">[وصف السلسلة كما يكتبه فريق الموقع: ما المقصود بدلائل النبوّة، ولماذا رُتّبت الحلقات بهذا الترتيب، ولمن هي.]</p>
        <div class="m" style="font-size:14px"><span><span class="lat">24</span> حلقة</span><span>·</span><span>نحو <span class="lat">8</span> ساعات</span><span>·</span><span><span class="lat">3</span> محاور</span><span>·</span><span>بالعربية</span><span class="kab">CC · Taqbaylit لبعضها</span></div>
        <div style="display:flex;align-items:center;gap:12px;font-size:13px;color:#6B706C"><div style="width:280px;height:6px;border-radius:999px;background:#E6E1D6;overflow:hidden"><div style="width:17%;height:100%;background:#C9A24A"></div></div><span>شاهدتَ <span class="lat">4</span> من <span class="lat">24</span> على هذا الجهاز</span></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px">
          <a class="btn btn-p" href="Watch.dc.html"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z" fill="currentColor"></path></svg>تابِع الحلقة <span class="lat">5</span> · بقي <span class="lat">12</span> د</a>
          <a class="btn btn-s" href="Watch.dc.html">من الحلقة الأولى</a>
          <button type="button" class="btn btn-s" aria-label="مشاركة السلسلة" style="width:48px;padding:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"></path></svg></button>
        </div>
      </div>
    </section>

    <div style="position:sticky;top:72px;z-index:3;background:#F5F3EE;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 0;margin-top:36px;border-bottom:1px solid #E4E0D6">
      <div role="group" aria-label="محاور السلسلة" style="display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="chip on" aria-pressed="true">كل الحلقات</button>
        <button type="button" class="chip" aria-pressed="false">[المحور الأول]</button>
        <button type="button" class="chip" aria-pressed="false">[المحور الثاني]</button>
        <button type="button" class="chip" aria-pressed="false">[المحور الثالث]</button>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <label style="display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;background:#FFFFFF;border:1px solid #E4E0D6;font-size:14px;color:#6B706C"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">ابحث في السلسلة</span><input type="search" placeholder="ابحث في السلسلة" style="border:0;background:transparent;font:inherit;font-size:14px;outline:none;width:150px"></label>
        <select aria-label="الترتيب" style="height:40px;border:1px solid #E4E0D6;border-radius:12px;padding:0 12px;font:inherit;font-size:14px;background:#FFFFFF"><option>بالترتيب</option><option>الأحدث أولًا</option></select>
      </div>
    </div>

    <sc-for list="{{axes}}" as="ax" hint-placeholder-count="2">
      <section>
        <div class="axh"><h2 style="margin:0;font-size:20px;font-weight:700">{{ax.label}}</h2><span style="font-size:15px;color:#6B706C">{{ax.name}}</span><span style="margin-inline-start:auto;font-size:13px;color:#6B706C">{{ax.count}}</span></div>
        <ol style="list-style:none;margin:0;padding:0">
          <sc-for list="{{ax.eps}}" as="e" hint-placeholder-count="3">
            <li><a class="row" href="Watch.dc.html" style="background:{{e.bg}}">
              <span class="n" style="color:{{e.nc}}">{{e.n}}</span>
              <div class="thumb" style="background-color:{{e.tone}}"><span class="dur">{{e.dur}}</span><sc-if value="{{e.p}}" hint-placeholder-val="{{ false }}"><span class="prog"><span style="width:{{e.p}}"></span></span></sc-if></div>
              <div style="display:flex;flex-direction:column;gap:6px;min-width:0"><h3 class="rt">{{e.title}}</h3><p class="rd">{{e.desc}}</p><div class="m"><span>{{e.date}}</span><sc-if value="{{e.kab}}" hint-placeholder-val="{{ false }}"><span class="kab">CC · Taqbaylit</span></sc-if></div></div>
              <span style="justify-self:end;font-size:13.5px;font-weight:600;color:{{e.sc}};display:flex;align-items:center;gap:6px">{{e.state}}</span>
            </a></li>
          </sc-for>
        </ol>
      </section>
    </sc-for>
    <div style="display:flex;justify-content:center;margin-top:28px"><button type="button" class="btn btn-s">عرض <span class="lat">15</span> حلقة أخرى</button></div>
  </main>
</div>
</template><div id="host"></div><script type="text/plain" id="logic">
class Component extends DCLogic {
  renderVals() {
    const tones = ['#DAD5CA', '#CFD8D2', '#D8D2C4', '#D3D9DB', '#E0D6CB'];
    const titles = ['مقدّمة: لماذا ندرس دلائل النبوّة؟', 'عنوان الحلقة الثانية يظهر هنا', 'عنوان أطول للحلقة الثالثة يلتفّ على سطرين كحدٍّ أقصى', 'عنوان الحلقة الرابعة', 'عنوان الحلقة الخامسة يظهر هنا', 'عنوان الحلقة السادسة', 'عنوان الحلقة السابعة', 'عنوان الحلقة الثامنة', 'عنوان الحلقة التاسعة'];
    const durs = ['14:20', '22:05', '19:48', '25:10', '17:33', '21:02', '23:40', '18:15', '20:44'];
    const dates = ['2 سبتمبر', '6 سبتمبر', '9 سبتمبر', '13 سبتمبر', '16 سبتمبر', '20 سبتمبر', '23 سبتمبر', '27 سبتمبر', '30 سبتمبر'];
    const ep = (i) => {
      const cur = i === 4, seen = i < 4;
      return {
        n: String(i + 1).padStart(2, '0'), title: titles[i], dur: durs[i], date: dates[i] + ' 2026', tone: tones[i % tones.length],
        desc: 'سطر واحد يلخّص موضوع الحلقة قبل مشاهدتها.', kab: i % 3 === 0,
        p: seen ? '100%' : (cur ? '31%' : ''), bg: cur ? '#FFFFFF' : 'transparent', nc: cur ? '#065A4C' : '#B79A57',
        state: cur ? '▶ تابِع من 05:26' : (seen ? '✓ شاهدتَها' : ''), sc: cur ? '#065A4C' : '#8A8F8C'
      };
    };
    const axes = [
      { label: 'المحور الأول', name: '[عنوان المحور]', count: '3 حلقات', eps: [0, 1, 2].map(ep) },
      { label: 'المحور الثاني', name: '[عنوان المحور]', count: '3 حلقات', eps: [3, 4, 5].map(ep) },
      { label: 'المحور الثالث', name: '[عنوان المحور]', count: '3 من 18', eps: [6, 7, 8].map(ep) }
    ];
    return { axes };
  }
}
</script></body></html>
