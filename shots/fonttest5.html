<!doctype html><html dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Markazi';src:url(assets/markazi-arabic.woff2) format('woff2');font-weight:400 700;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:MZ;src:url(assets/markazi-arabic.woff2) format('woff2');font-weight:400 700}
</style>
</head><body style="margin:0;background:#fff">
<div style="font-family:'Markazi',serif;font-size:70px;font-weight:600">دلائل النبوّة 1</div>
<div style="font-family:MZ;font-size:70px;font-weight:600">دلائل النبوّة 2</div>
<div id="r"></div>
<script>document.fonts.ready.then(()=>{document.getElementById('r').textContent=[...document.fonts].map(f=>f.family+':'+f.status).join(' | ')})</script>
